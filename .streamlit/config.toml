# Deployment hardening for Streamlit Community Cloud. See app.py's
# MAX_UPLOAD_BYTES (kept in sync with maxUploadSize below) for the
# application-level check -- this is the transport-level backstop.

[server]
maxUploadSize = 15
maxMessageSize = 15

[browser]
gatherUsageStats = false

[client]
# "type" (not "full") -- the repo/app is public, so an uncaught exception
# should surface enough to know what broke without leaking internal file
# paths/stack traces to a random visitor. Every failure mode we anticipate
# is already caught with its own clean st.error() message; this is only the
# backstop for something unanticipated.
showErrorDetails = "type"
